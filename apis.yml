aid: sila-money
url: https://raw.githubusercontent.com/api-evangelist/sila-money/refs/heads/main/apis.yml
name: Sila
kind: company
description: Sila is an embedded-finance / banking-as-a-service platform that exposes a
  money API for fintech developers. A single REST API covers identity verification
  (KYC/KYB), digital wallets, linked bank accounts, virtual accounts, debit-card
  payment methods, and money movement over the ACH network via an issue / transfer /
  redeem model. Every request is signed client-side with ECDSA (secp256k1) signatures
  over a Keccak-256 hash of the JSON message body, sent in "authsignature" and
  "usersignature" (and "businesssignature" for KYB) headers. As of the review date
  (2026-07-12) the sandbox and production hosts, the ReadMe-hosted docs, and multiple
  SDKs are live and actively maintained.
