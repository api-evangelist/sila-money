  description: >-
    Sila's Virtual Accounts product issues each user a dedicated account and routing number, giving a
    program a real bank-account surface for receiving and settling funds. Virtual accounts appear as a
    payment-method type in the get_payment_methods response. The dedicated virtual-account management
    endpoint names are not published on the pages reviewed and are therefore not modeled in the OpenAPI;
    see review.yml.
